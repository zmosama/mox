name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: package-lock.json is written by npm 11, and npm 10
          # cannot install from it — `npm ci` fails on every platform-gated
          # optional dependency with "Missing … from lock file".
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
